<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSG Fishing Game</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="console">
    <header>
      <h1 id="title">🛒 Market</h1>
      <span id="wallet">💰 $100</span>
    </header>

    <div id="container">
      <div id="screen">
        <img id="img-section" src="lake.png" alt="lake">
        <button id="btn-fish">Click to fish</button>
      </div>

      <div id="buttons">
        <section id="bait"></section>
        <section id="fish"></section>
        <button id="nav-go-fishing">Go fishing 🎣</button>
        <button id="nav-go-shopping">Go to market 🛒</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
